<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object example</title>
</head>
<body>
    <script>
        var a = {
            fname: 'Ayush',
            lname: 'Mhatre',
            age: 21,
            email: 'ayush@gmail.com',
            players: [' Virat', ' KL rahul', ' Vaibhav Suryawanshi', ' Ayush Badoni'],
            address:{
                city: 'Kolhapur',
                country: 'India'
            },
            phone: 8499999999,
            message: 'Hello!!'
        }

        document.write("My name is: " + a.fname + "<br>" + " Age is: " + a.age + "<br>" + "My fav player is:" + a.players[2] + "<br>" + "My city: " + a.address.city);
    </script>
</body>
</html>
