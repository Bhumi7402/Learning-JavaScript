<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Types</title>
</head>
<body>
    <!-- Inline JS example -->
     <button onclick="alert('This is Inline JS')">Inline</button>
    
    <!-- Internal JS Example -->
     <button onclick="showMessage()">Internal</button>

    <!-- External JS Example -->
     <button onclick="hello()">External</button>

     <script>
        function showMessage(){
            alert('This is Internal JS')
        }
     </script>
     <script src="JS/script.js" type="text/javascript"></script>
</body>
</html>
